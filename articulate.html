    S.ap = S.mod === "allplay"; S.dbl = S.mod === "double"; S.apGot = S.teams.map(function () { return 0; });
    S.got = []; S.pass = 0; S.xs = 0; S.paused = false; S.started = false; S.word = nextWord(); S.left = S.secs * 1000; S.endAt = 0; S.phase = "play";
    clearInterval(timer); drawPlay(); playDock();   // the word is up and the clock waits: it starts the moment the describer begins
  }
  function beginClock() {
    if (S.phase !== "play" || S.started) return; S.started = true; S.paused = false; S.endAt = Date.now() + S.left; startTimerOnly(); beep(); updClock(); playDock();
    var sn = $("sn"); if (sn) sn.style.display = "none";
  }
  function playDock() { if (!S.started) return setDock([["begin", "Start the clock", ICON.play], ["pass", "Pass", ICON.skip]]); setDock(S.ap ? [["pass", "Pass (P)", ICON.skip], ["xmark", "Wrong / rule broken (X)", ICON.xm], ["pause", "Pause", ICON.pause]] : [["undo", "Undo last", ICON.back], ["pass", "Pass (P)", ICON.skip], ["xmark", "Wrong / rule broken (X)", ICON.xm], ["pause", "Pause", ICON.pause], ["right", "Got it", ICON.next]]); }
  function drawPlay() {
    var ap = S.ap ? '<div class="aps">' + S.teams.map(function (t) { return '<button type="button" data-ap="' + t.id + '">' + t.shape + " " + (t.id + 1) + "<b>" + S.apGot[t.id] + "</b></button>"; }).join("") + '</div><div class="rem">All Play: tap (or press the number of) the team that shouted the answer first</div>' : '<div class="rem">' + (S.dbl ? "DOUBLE: every word counts twice &middot; " : "") + 'No part of the word, no "sounds like", no first letter, no letter count</div>';
    view.innerHTML = '<div class="main play2">' + boardHtml(true) + '<div class="bigcard"><div class="strip">' + CATS.map(function (c) { return '<span class="' + (c === S.cat ? "on" : "") + '">' + c + "</span>"; }).join("") + '</div><div class="word" id="wd"></div><div class="clock" id="ck"></div><div class="bar"><i id="br"></i></div><div class="got" id="gt"></div>' + ap + (S.started ? "" : '<div class="startnote" id="sn">Press &#9654; the moment you start describing. The clock does not run until you do.</div>') + "</div></div>";
    drawWheel(); setWord(); updClock();
    var ab = view.querySelector(".aps"); if (ab) ab.addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) award(+b.dataset.ap); });
  }
  function setWord() {
    var el = $("wd"); if (!el) return;
    var img = (window.ART_IMG || {})[S.word], emo = "";   // no picture hints: the card shows the word and nothing else
    el.innerHTML = (img ? '<img class="wpic" alt="" src="' + esc(img) + '">' : emo ? '<span class="wpic em">' + emo + "</span>" : "") + '<span class="wt">' + esc(S.word) + "</span>";
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
    var size = img || emo ? 6 : 7.2; el.style.fontSize = size + "vw"; var guard = 0;
    while ((el.scrollWidth > el.clientWidth + 2 || el.scrollHeight > el.clientHeight + 2) && size > 2.2 && guard++ < 50) { size -= .3; el.style.fontSize = size + "vw"; }
    var tot = S.ap ? S.apGot.reduce(function (a, b) { return a + b; }, 0) : S.got.length;
    var pl = Math.max(0, S.passMax - S.pass), xl = S.xMax ? " · " + "\u2715".repeat(S.xs) + "\u25CB".repeat(Math.max(0, S.xMax - S.xs - 1)) + " X marks" : "";
    $("gt").textContent = tot + (tot === 1 ? " word" : " words") + " · " + pl + (pl === 1 ? " pass left" : " passes left") + xl;
  }
  function updClock() {
    var ck = $("ck"), br = $("br"); if (!ck) return; var sec = Math.ceil(S.left / 1000);
    ck.textContent = !S.started ? S.secs : S.paused ? "Paused" : sec; ck.classList.toggle("low", S.started && !S.paused && sec <= 10 && sec > 0);
    br.style.width = (100 * S.left / (S.secs * 1000)) + "%";
  }
  function right() { if (S.phase === "play" && !S.started) return beginClock(); if (S.phase !== "play" || S.paused || S.ap) return; S.got.push(S.word); ding(); S.word = nextWord(); setWord(); }
  function award(i) {
    if (S.phase !== "play" || !S.started || S.paused || !S.ap || i < 0 || i >= S.teams.length) return;
    S.apGot[i]++; S.got.push(S.word); ding(); S.word = nextWord();
    var b = view.querySelector('.aps button[data-ap="' + i + '"] b'); if (b) b.textContent = S.apGot[i];
    setWord();
  }
  function undo() { if (S.phase !== "play" || S.ap || !S.got.length) return; S.word = S.got.pop(); setWord(); }
  function pass() {
    if (S.phase !== "play" || S.paused) return;
    if (S.pass >= S.passMax) { toast(S.passMax ? "No passes left this turn. Keep going!" : "No passing in this game."); return; }
    S.pass++; S.word = nextWord(); setWord();
  }
  // X: the word was wrong or a description rule was broken. It scores nothing and the next word comes up; reaching the limit ends the turn.
  function xmark() {
    if (S.phase !== "play" || !S.started || S.paused || !S.xMax) return;
    S.xs++; tone(220, .25, "sawtooth", .22);
    if (S.xs >= S.xMax) { clearInterval(timer); buzzer(); toast("Too many X marks: the turn is over."); return endTurn(); }
    S.word = nextWord(); setWord();
  }
  function pause() {
    if (S.phase !== "play" || !S.started) return;
    if (!S.paused) { S.paused = true; S.left = Math.max(0, S.endAt - Date.now()); } else { S.paused = false; S.endAt = Date.now() + S.left; }
    updClock();
  }
  function endTurn() {
    S.phase = "result"; var t = S.teams[S.cur], html;
    if (S.ap) {
      S.moves = S.teams.map(function (tt, i) { return { t: tt, n: S.apGot[i] }; }).filter(function (m) { return m.n > 0; });
      html = '<div class="small">Time &middot; All Play</div><div class="big">' + (S.moves.length ? "Who got what" : "Nobody scored") + '</div><div class="words">' + S.moves.map(function (m) { return "<span>" + m.t.shape + " " + esc(tname(m.t)) + ": " + m.n + "</span>"; }).join("") + '</div><div class="small">Everyone moves forward by their own words &middot; press &#9654;</div>';
    } else {
      var n = S.got.length, mult = S.dbl ? 2 : 1, bonus = (S.rules.streak && n >= BONUS_AT) ? 1 : 0, tot = n * mult + bonus;
      S.moves = tot ? [{ t: t, n: tot }] : [];
      var calc = [n + (n === 1 ? " word" : " words")]; if (S.dbl) calc.push("&times;2 double"); if (bonus) calc.push("+1 streak bonus (" + BONUS_AT + "+ words)");
      html = '<div class="small">Time &middot; ' + esc(who(t)) + '</div><div class="big">' + tot + (tot === 1 ? " square" : " squares") + '</div><div class="words">' + S.got.map(function (w) { return "<span>" + esc(w) + "</span>"; }).join("") + '</div><div class="small">' + calc.join(" &middot; ") + " &middot; press &#9654;</div>";
    }
    view.innerHTML = '<div class="view msg">' + html + "</div>";
    setDock(!S.ap && S.got.length ? [["undo", "Back to the clock", ICON.back], ["move", "Move", ICON.next]] : [["move", S.moves.length ? "Move" : "Next team", ICON.next]]);
  }
  function move() {
    var q = (S.moves || []).slice(), qi = 0, ci = 0; S.phase = "moving"; setDock([]);
    function show(t, n) { boardView('<div class="who"><i>' + who(t) + "</i>moving " + n + '</div><div class="hint">&nbsp;</div>'); }
    (function next() {
      if (qi >= q.length) return finishMove();
      var m = q[qi], i = 0; show(m.t, m.n);
      (function step() {
        if (i >= m.n || m.t.pos >= FIN) { qi++; return setTimeout(next, 250); }
        m.t.pos++; i++; tick(); show(m.t, m.n); setTimeout(step, 340);
      })();
    })();
  }
  function finishMove() {
    var t = S.teams[S.cur]; t.turns++;
    var w = S.teams.filter(function (x) { return x.pos >= FIN; })[0];
    if (w) { S.winner = w.id; S.phase = "win"; save(); fanfare(); view.innerHTML = '<div class="view msg"><div class="small">We have a winner</div><div class="big"><em>' + esc(who(w)) + '</em></div><div class="words">' + w.members.map(function (m) { return "<span>" + esc(m) + "</span>"; }).join("") + '</div><div class="small">Press &#9654; for a new game</div></div>'; setDock([["newgame", "New game", ICON.again]]); return; }
    S.cur = (S.cur + 1) % S.teams.length; goReady();
  }
  function newGame() { try { localStorage.removeItem(KEY); } catch (e) {} S.phase = "setup"; S.winner = -1; prevTeams = null; renderSetup(); }

  // ---------- rules: a walk-through, plus the hints the game gives as it goes ----------
  var rulePage = 0;
  function rulePages() {
    var p = [
      ["The goal", "<p>Each team has a <b>totem</b> on the board. Get yours round the track from <b>START</b> to <b>FINISH</b>. The first team there wins.</p>"],
      ["Your turn", "<p><b>1.</b> Press &#9654; to spin the arrow in the middle. It picks your category" + (S.rules.allplay || S.rules.double || S.rules.skip ? " or a special" : "") + ".</p><p><b>2.</b> One person describes. Their team guesses with their backs to the screen.</p><p><b>3.</b> You have <b>" + S.secs + " seconds</b>. Get as many words as you can. The buzzer ends the turn.</p>"],
      ["Describing", "<p>You can not say the word, any part of it, say what it sounds like, give the first letter or say how many letters it has.</p><p>Break a rule and it is an X. Stuck? Press <b>P</b> to pass. You get <b>" + S.passMax + (S.passMax === 1 ? " pass" : " passes") + "</b> each turn.</p>" + (S.xMax ? "<p>Wrong, or a rule broken? Press <b>X</b>. The word scores nothing and the next one comes up. <b>" + S.xMax + "</b> X marks ends the turn, but the words you already got still count.</p>" : "") + ""],
      ["Moving", "<p>Every correct word moves your totem <b>one square</b>.</p>" + (S.rules.streak ? "<p>Get <b>" + BONUS_AT + " or more</b> in one turn and you earn <b>+1 bonus square</b>.</p>" : "")],
      ["Categories", "<p>" + CATS.map(function (c) { return "<b>" + c + ":</b> " + esc(CATTIP[c]); }).join("</p><p>") + "</p>"]
    ];
    var sp = ["allplay", "double", "skip"].filter(function (k) { return S.rules[k]; });
    if (sp.length) p.push(["Special spins", "<p>" + sp.map(function (k) { return "<b>" + SPECIAL[k].name + ":</b> " + esc(SPECIAL[k].rule); }).join("</p><p>") + "</p>"]);
    p.push(["Keys", "<p><b>Space or &rarr;</b> spin, start, got it, next<br><b>&larr;</b> undo<br><b>P</b> pass &nbsp; <b>X</b> wrong / rule broken &nbsp; <b>.</b> pause<br><b>1 to 8</b> award a team in All Play<br><b>?</b> this page &nbsp; <b>Esc</b> close</p>"]);
    return p;
  }
  var rulesWasPaused = false;
  function showRules(page) {
    var P = rulePages(); rulePage = Math.max(0, Math.min(P.length - 1, page == null ? 0 : page));
    $("rnum").textContent = "How to play · " + (rulePage + 1) + " of " + P.length; $("rttl").textContent = P[rulePage][0]; $("rbody").innerHTML = P[rulePage][1];
    $("rules").classList.add("on");
  }
  function rulesOpen() { return $("rules").classList.contains("on"); }
  function rulesKey(k) {
    var n = rulePages().length;
    if (k === "ArrowRight" || k === " " || k === "Enter" || k === "PageDown") { if (rulePage >= n - 1) $("rules").classList.remove("on"); else showRules(rulePage + 1); }
    else if (k === "ArrowLeft" || k === "PageUp" || k === "Backspace") showRules(rulePage - 1);
    else if (k === "Escape" || k === "?") $("rules").classList.remove("on");
  }
  $("rules").addEventListener("click", function (e) { if (e.target === $("rules")) $("rules").classList.remove("on"); else rulesKey("ArrowRight"); });

  // ---------- dock + keys ----------
  var ICON = {
    play: '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>',
    pause: '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
    next: '<svg viewBox="0 0 24 24"><path d="M5 5v14l10-7zM16 5h3v14h-3z"/></svg>',
    back: '<svg viewBox="0 0 24 24"><path d="M19 5v14L9 12zM5 5h3v14H5z"/></svg>',
    skip: '<svg viewBox="0 0 24 24"><path d="M5 13c0-4 3-7 8-7h3l-2-2 2-2 6 6-6 6-2-2 2-2h-3c-3 0-5 2-5 4v4H5z" transform="translate(0 1) scale(.95)"/></svg>',
    again: '<svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>',
    fs: '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    xm: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" fill="none"/></svg>',
    x: '<svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>',
    q: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M9.2 9.3c0-1.7 1.3-2.8 2.9-2.8 1.7 0 2.9 1 2.9 2.5 0 2-2.6 2.2-2.6 4.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12.4" cy="17.4" r="1.3"/></svg>'
  };
  function setDock(items) {
    var list = items.slice(); if (S.phase !== "play" && S.phase !== "spin" && S.phase !== "moving") list.push(["rules", "How to play (?)", ICON.q]);
    list.push(["fs", "Full screen", ICON.fs]);
    dock.innerHTML = list.map(function (it) { return '<button type="button" data-a="' + it[0] + '" title="' + it[1] + '">' + it[2] + "</button>"; }).join("");
  }
  dock.addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) act(b.dataset.a); });
  function primary() {
    var p = S.phase;
    if (p === "ready") spin(); else if (p === "special") { if (S.mod === "skip") skipTurn(); else spin(); } else if (p === "landed") startTurn(); else if (p === "play") right(); else if (p === "result") move(); else if (p === "win") newGame();
  }
  function act(a) {
    actx();
    if (a === "spin" || a === "respin") { S.mod = ""; spin(); } else if (a === "begin") beginClock(); else if (a === "go") primary(); else if (a === "start") startTurn();
    else if (a === "right") right(); else if (a === "rules") showRules(0);
    else if (a === "undo") { if (S.phase === "result") { S.phase = "play"; var w = S.got.pop(); S.word = w || nextWord(); S.paused = false; S.started = true; S.left = 8000; S.endAt = Date.now() + 8000; drawPlay(); clearInterval(timer); startTimerOnly(); playDock(); } else undo(); }
    else if (a === "pass") pass(); else if (a === "xmark") xmark(); else if (a === "pause") pause(); else if (a === "move") move(); else if (a === "newgame") { if (S.phase === "ready" && !confirm("Start a new game? Positions are lost.")) return; newGame(); }

    else if (a === "fs") toggleFs();
  }
  function toast(t) { var d = $("toast"); d.textContent = t; d.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(function () { d.style.display = "none"; }, 7000); }
  function toggleFs() {
    var el = document.documentElement, fe = document.fullscreenElement || document.webkitFullscreenElement;

      if (fe) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
      var rq = el.requestFullscreen || el.webkitRequestFullscreen;
      if (rq) { var r = rq.call(el); if (r && r.catch) r.catch(function () { toast("Full screen was blocked here. Try the full-screen option in your browser menu."); }); return; }
    } catch (e) {}
    toast("iPhone Safari cannot do full screen. Tap Share, then Add to Home Screen, and open it from the Home Screen icon.");
  }
  function startTimerOnly() {
    var lastWhole = -1;
    timer = setInterval(function () { if (S.paused) return; S.left = Math.max(0, S.endAt - Date.now()); var whole = Math.ceil(S.left / 1000); if (whole !== lastWhole) { lastWhole = whole; if (whole <= 10 && whole > 0) beep(); } updClock(); if (S.left <= 0) { clearInterval(timer); buzzer(); endTurn(); } }, 100);
  }
  function closeMe() { if (inFrame) { try { window.parent.postMessage({ gcgartclose: true }, "*"); } catch (e) {} } else location.href = "play.html"; }
  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.tagName === "INPUT") return;
    var k = e.key;

    if (k === "?" || (k === "/" && e.shiftKey)) { if (S.phase !== "play") { e.preventDefault(); showRules(0); } return; }
    if (S.phase === "setup") { if (k === "Escape") closeMe(); return; }
    if (S.phase === "spin" || S.phase === "moving") return;
    if (S.phase === "play" && S.ap && k >= "1" && k <= "8") { award(+k - 1); return; }
    if (k === " " || k === "Enter" || k === "ArrowRight" || k === "PageDown" || k === "MediaTrackNext") { e.preventDefault(); primary(); }
    else if (k === "ArrowLeft" || k === "PageUp" || k === "Backspace") { e.preventDefault(); if (S.phase === "play") undo(); else if (S.phase === "landed") act("respin"); }
    else if (k === "p" || k === "P") pass();
    else if (k === "x" || k === "X") xmark();
    else if (k === "." || k === "b" || k === "B") pause();
    else if (k === "Escape") closeMe();
  });
  document.addEventListener("wheel", function (e) { if (S.phase === "setup" || S.phase === "spin" || S.phase === "moving") return; e.preventDefault(); }, { passive: false });
  // wake the parent's top icons when the mouse moves in here
  document.addEventListener("mousemove", function () { if (inFrame) try { window.parent.postMessage("gcg-attention", "*"); } catch (e) {} });

  if (/[?&]test\b/.test(location.search)) window.__art = { setWord: setWord, S: S, resolve: resolve, DIAL: DIAL, goReady: goReady, startTurn: startTurn, endTurn: endTurn, primary: primary };
  // ---------- start ----------
  loadPeople().then(function () {
    if (restore()) { goReady(); }
    else { S.sel = {}; people().forEach(function (p) { if (here && here[p.id]) S.sel[p.id] = true; }); renderSetup(); }
  });
  window.focus();
})();
