<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Play - Hinda's 28th</title>
<style>
html,body{margin:0;height:100%;background:#F5D76E;overflow:hidden}
iframe{border:0;position:fixed;left:0;width:100%}
#scr{top:0;height:100%}
#hst{bottom:0;height:42vh;transform:translateY(105%);transition:transform .25s;background:transparent}
body.show #hst{transform:none}
#tools{position:fixed;top:10px;left:10px;z-index:5;display:flex;gap:8px;opacity:0;transition:opacity .25s}
body.show #tools{opacity:1}
#tools a,#tools button{font:700 13px/1 Inter,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:#F5D76E;background:#08183E;border:0;border-radius:8px;padding:11px 14px;cursor:pointer}
body{cursor:default}body:not(.show){cursor:none}
</style></head><body>
<iframe id="scr" src="screen.html" allow="autoplay; fullscreen"></iframe>
<iframe id="hst" src="host.html?play=1&embed=1" allow="autoplay"></iframe>
<div id="tools"><a href="host.html">Setup</a><button id="fs" type="button">Fullscreen</button><button id="pin" type="button">Keep buttons up</button></div>
<script>
(function () {
  var b = document.body, t = 0, pinned = false;
  function show() { b.classList.add("show"); clearTimeout(t); if (!pinned) t = setTimeout(function () { b.classList.remove("show"); }, 5000); }
  // The room should see only the game. Move the mouse, touch the screen or press a key and the buttons come up for a few seconds.
  ["mousemove", "mousedown", "touchstart", "keydown"].forEach(function (e) { document.addEventListener(e, show, { passive: true }); });
  // the game frame has focus only for sound; the host frame takes the keys (Space or Enter = the big gold button)
  function toHost() { try { document.getElementById("hst").contentWindow.focus(); } catch (e) {} }
  document.getElementById("hst").addEventListener("load", toHost);
  document.addEventListener("keydown", function (e) { if (/^( |Enter|p|P|k|K|s|S)$/.test(e.key)) { e.preventDefault(); try { document.getElementById("hst").contentWindow.postMessage({ gcgkey: e.key }, "*"); } catch (x) {} } });
  document.getElementById("fs").onclick = function () { var d = document.documentElement; (d.requestFullscreen || d.webkitRequestFullscreen).call(d); };
  document.getElementById("pin").onclick = function () { pinned = !pinned; this.textContent = pinned ? "Auto-hide buttons" : "Keep buttons up"; show(); };
  // Messages from the host frame (a karaoke question or a pause needs you) bring the buttons up.
  window.addEventListener("message", function (e) { if (e.data === "gcg-attention") show(); else if (e.data && e.data.gcgkey) { show(); try { document.getElementById("hst").contentWindow.postMessage(e.data, "*"); } catch (x) {} } });
  show();
})();
</script></body></html>
