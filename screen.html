<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Projector</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
/* Projector stays dark so it does not glare in a dim room; yellow stays the lead colour. */
:root{--bg:#08183E;--card:#0F2560;--yellow:#F5D76E;--mint:#3DBFA0;--white:#F0EDE4;--red:#D94050;--muted:#8AAAC0;--dim:#4A6080;--border:rgba(255,255,255,.14);color-scheme:dark}
html,body{height:100%}
body{padding:0;overflow:hidden;cursor:none;
  background:radial-gradient(ellipse at center,transparent 30%,rgba(4,10,28,.85) 100%),
  linear-gradient(rgba(61,191,160,.05) 1px,transparent 1px) 0 0/52px 52px,
  linear-gradient(90deg,rgba(61,191,160,.05) 1px,transparent 1px) 0 0/52px 52px,var(--bg)}
#stage{height:100%;display:grid;place-items:center;text-align:center;padding:4vw;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.big{font-family:var(--serif);font-style:italic;font-size:clamp(40px,8vw,120px);line-height:.95;text-wrap:balance}
.big span{color:var(--yellow)}
.tag{font-size:clamp(10px,1.3vw,16px);letter-spacing:.32em;text-transform:uppercase;color:var(--mint);margin:0 0 2vw}
.badge{font-family:var(--bebas);font-size:clamp(20px,3.4vw,44px);letter-spacing:.26em;color:var(--yellow);border:1px solid rgba(245,215,110,.4);background:rgba(245,215,110,.06);padding:.2em .9em;display:inline-block;margin-bottom:2vw}
.sub{font-family:var(--mono);font-size:clamp(14px,2.4vw,32px);color:var(--muted);margin-top:2vw}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:5vw;text-align:left;margin-top:2vw}
.cols h2{font-family:var(--bebas);letter-spacing:.24em;font-size:clamp(16px,2.4vw,32px);color:var(--yellow);border-bottom:1px solid var(--border);padding-bottom:.6vw;margin-bottom:1.2vw}
.cols li{list-style:none;font-family:var(--serif);font-style:italic;font-size:clamp(22px,3.8vw,52px);line-height:1.15}
.cols ul{margin:0;padding:0;display:grid;gap:.8vw}
.red{color:var(--red)}
.note{font-size:clamp(11px,1.7vw,22px);border:1px solid rgba(61,191,160,.35);background:rgba(61,191,160,.08);padding:1vw 2vw;margin-top:3vw;text-align:left}
.note b{font-family:var(--bebas);font-weight:400;letter-spacing:.2em;color:var(--mint);font-size:1.5em;margin-right:1em}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:5vw;margin-top:3vw;text-align:left}
.sides h2{font-family:var(--bebas);letter-spacing:.24em;font-size:clamp(20px,3vw,40px);margin-bottom:1vw}
.sides .f h2{color:var(--mint)}.sides .a h2{color:var(--red)}
.sides li{list-style:none;font-family:var(--serif);font-style:italic;font-size:clamp(20px,3.2vw,44px);line-height:1.15}
.sides ul{margin:0;padding:0}
/* Result flashes: red + buzzer for wrong, yellow + confetti for right. Level 1-6 sets how big the celebration is. */
/* The name screen: yellow ground, blue accents (the brand look). Other screens stay dark for the room. */
body.home{background:#F5D76E!important;--white:#08183E;--yellow:#08183E;--mint:#08183E;--muted:#2F4268}
body.home .big{font-size:clamp(48px,11vw,170px)}
body.res-no{background:#C0152C!important;--white:#fff;--muted:#ffd9de;--yellow:#fff}
body.res-ok{background:#F5D76E!important;--white:#08183E;--muted:#2F4268;--yellow:#08183E;--mint:#08183E}
body.res-no #stage .big,body.res-ok #stage .big{animation:pop .5s ease-out}
body.shake #stage{animation:shake .45s linear 3}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-1.2vw,.5vw)}40%{transform:translate(1.2vw,-.5vw)}60%{transform:translate(-.8vw,-.4vw)}80%{transform:translate(.8vw,.4vw)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.fs{position:fixed;right:12px;bottom:10px;font:11px var(--mono);color:var(--dim);cursor:pointer;background:none;border:0}
</style>
</head>
<body>
<div id="stage"></div>
<canvas id="fx"></canvas>
<button class="fs" id="fs">click once to enable sound · fullscreen</button>
<script src="config.js"></script>
<script src="assets/store.js"></script>
<script>
(function () {
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
  var title = window.GCG_CONFIG.TITLE || "";
  var last = "";
  function li(a) { return (a || []).map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("") || '<li style="color:var(--dim)">nobody</li>'; }
  function view(s) {
    if (s.mode === "menu") return '<div><p class="tag">' + esc(title) + '</p><div class="big">What\'s on the <span>table</span></div>' +
      '<div class="cols"><div><h2>FOOD</h2><ul><li>Vege noodles</li><li>Beef goulash</li><li>Potato salad</li><li>Chicken wings</li></ul></div>' +
      '<div><h2>DRINKS</h2><ul><li class="red">Sobolo</li><li>Ginger and pineapple</li><li>Water</li></ul></div></div>' +
      '<div class="note"><b>ALLERGIES</b>Tell Hinda or the host before you eat. Any dish can be checked.</div></div>';
    if (s.mode === "beerules") return '<div><span class="badge">THE EVIL SPELLING BEE</span><div class="sides" style="text-align:left"><div class="f"><h2>YOU MAY ASK FOR</h2><ul><li>Definition</li><li>Sentence</li><li>Part of speech</li></ul></div><div class="a"><h2>YOU MAY NOT ASK FOR</h2><ul><li>The first letter</li><li>The number of letters</li><li>Another sentence</li><li>The word in a different context</li></ul></div></div></div>';
    if (s.mode === "beestage") return '<div><span class="badge">SPELLING BEE</span><div class="big" style="font-size:clamp(70px,16vw,240px)">' + esc(s.standing) + '</div><div class="sub">still standing</div>' + (s.next ? '<div class="sub" style="color:var(--yellow)">Up next: ' + esc(s.next) + '</div>' : "") + '</div>';
    if (s.mode === "beecall") return '<div><span class="badge">ROUND ' + esc(s.round) + '</span><div class="big">' + esc(s.name) + '</div><div class="sub" style="color:var(--yellow)">to the stage</div><div class="sub">' + esc(s.standing) + ' still standing</div></div>';
    if (s.mode === "beewin") return '<div><span class="badge">LAST ONE STANDING</span><div class="big">' + esc(s.name) + '</div><div class="sub" style="color:var(--yellow)">Spelling bee champion</div></div>';
    if (s.mode === "bee") {
      var head = '<span class="badge">ROUND ' + esc(s.round) + '</span>';
      var foot = '<div class="sub">' + esc(s.contestant) + ' &middot; ' + esc(s.standing) + ' still standing &middot; ' + esc(s.n) + ' / ' + esc(s.total) + '</div>';
      if (s.phase !== "result") return '<div style="max-width:1300px">' + head + '<div class="big" style="font-size:clamp(30px,5.4vw,80px)">' + esc(s.sentence) + '</div><div class="sub" style="display:flex;gap:2vw;justify-content:center;flex-wrap:wrap;color:var(--yellow);font-family:var(--serif);font-style:italic;font-size:clamp(24px,4vw,56px)">' + (s.options || []).map(function (o) { return '<span style="border:1px solid var(--border);padding:.1em .6em">' + esc(o) + '</span>'; }).join('') + '</div>' + foot + '</div>';
      var alts = (s.alts || []).map(function (a) { return '<li style="' + (a.right ? "color:var(--mint)" : "") + '">' + esc(a.w) + ' <span style="font-family:var(--mono);font-style:normal;font-size:.4em;color:var(--muted)">' + esc(a.m) + '</span></li>'; }).join("");
      return '<div style="max-width:1300px">' + head + '<div class="big" style="color:' + (s.ok ? "var(--mint)" : "var(--red)") + '">' + (s.ok ? "CORRECT ✓" : "INCORRECT ✕") + '</div>' + (s.said ? '<div class="sub">They spelled: ' + esc(s.said) + '</div>' : '') + '<div class="sub" style="color:var(--yellow)">' + esc(s.answer) + '</div><div class="sides" style="grid-template-columns:1fr"><ul style="text-align:left;max-width:900px;margin:0 auto">' + alts + '</ul></div>' + foot + '</div>';
    }
    if (s.mode === "karaoke") return '<div><span class="badge">SURPRISE KARAOKE</span><div class="big">' + esc(s.name) + '</div>' +
      '<div class="sub">Your song has been selected: <span style="color:var(--yellow)">' + esc(s.song) + '</span></div><div class="big" style="font-size:clamp(30px,5vw,70px);margin-top:3vw;color:var(--mint)">You\'re up.</div></div>';
    if (s.mode === "hottake") return '<div style="max-width:1300px"><span class="badge">HOT TAKE</span><div class="big" style="font-size:clamp(32px,5.6vw,84px)">' + esc(s.text) + '</div>' +
      (s.reveal ? '<div class="sub" style="color:var(--yellow);letter-spacing:.2em;text-transform:uppercase">Tonight you argue the opposite</div><div class="sides"><div class="f"><h2>ARGUE FOR</h2><ul>' + li(s.argueFor) + '</ul></div><div class="a"><h2>ARGUE AGAINST</h2><ul>' + li(s.argueAgainst) + '</ul></div></div>' : "") + '</div>';
    return '<div><p class="tag">The game night</p><div class="big">' + esc(title) + '</div></div>';
  }
  store.subscribe("state", function (s) {
    s = s || { mode: "home" };
    var k = JSON.stringify(s); if (k === last) return; last = k;
    var el = document.getElementById("stage"); el.style.animation = "none"; void el.offsetWidth; el.style.animation = "";
    el.innerHTML = view(s);
    react(s);
  });

  // ---- Right / wrong effects ----
  var first = true, fx = document.getElementById("fx"), ctx2 = fx.getContext("2d"), parts = [], raf = 0, ac = null;
  function audio() {
    try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch (e) { ac = null; }
    return ac;
  }
  document.addEventListener("click", function () { audio(); document.getElementById("fs").textContent = "fullscreen"; });
  function tone(f, t0, dur, type, vol) {
    var a = audio(); if (!a) return; var o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, a.currentTime + t0); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + t0 + dur);
    o.connect(g); g.connect(a.destination); o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + dur + .05);
  }
  function noise(dur, vol) {
    var a = audio(); if (!a) return; var n = a.sampleRate * dur, b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 2500; g.gain.value = vol;
    s.buffer = b; s.connect(f); f.connect(g); g.connect(a.destination); s.start();
  }
  function buzzer() { tone(110, 0, .45, "sawtooth", .8); tone(117, 0, .45, "square", .5); tone(98, .5, .7, "sawtooth", .8); tone(104, .5, .7, "square", .5); noise(.3, .5); }
  function cheer(level) {
    var notes = [523, 659, 784, 1047, 1319, 1568, 2093], count = 3 + level * 2, step = Math.max(.07, .16 - level * .015);
    for (var i = 0; i < count; i++) tone(notes[i % notes.length] * (i >= 7 ? 2 : 1), i * step, .3, "triangle", .18 + level * .04);
    noise(.4 + level * .35, .08 + level * .05);
    if (level >= 4) { tone(262, count * step, 1.2, "sawtooth", .25); tone(392, count * step, 1.2, "sawtooth", .2); tone(523, count * step, 1.2, "sawtooth", .2); }
  }
  function confetti(n) {
    fx.width = innerWidth; fx.height = innerHeight; var cols = ["#08183E", "#ffffff", "#D94050", "#3DBFA0", "#F0EDE4"];
    for (var i = 0; i < n; i++) parts.push({ x: Math.random() * fx.width, y: -20 - Math.random() * fx.height * .5, vx: (Math.random() - .5) * 6, vy: 2 + Math.random() * 6, s: 6 + Math.random() * 10, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[i % cols.length] });
    cancelAnimationFrame(raf); (function step() {
      ctx2.clearRect(0, 0, fx.width, fx.height);
      parts.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.vy += .06; p.r += p.vr; ctx2.save(); ctx2.translate(p.x, p.y); ctx2.rotate(p.r); ctx2.fillStyle = p.c; ctx2.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx2.restore(); });
      parts = parts.filter(function (p) { return p.y < fx.height + 30; });
      if (parts.length) raf = requestAnimationFrame(step); else ctx2.clearRect(0, 0, fx.width, fx.height);
    })();
  }
  // Level 1-5 grows with the round and with how few people are left; 6 is the champion.
  function levelFor(s) { return s.mode === "beewin" ? 6 : Math.min(5, (s.round || 1) + ((s.standing || 9) <= 3 ? 1 : 0)); }
  function react(s) {
    var b = document.body; b.classList.remove("res-ok", "res-no", "shake", "home");
    if (s.mode !== "menu" && s.mode !== "karaoke" && s.mode !== "hottake" && s.mode !== "bee" && s.mode !== "beerules" && s.mode !== "beestage" && s.mode !== "beecall" && s.mode !== "beewin") b.classList.add("home");
    var wasFirst = first; first = false; // a page opened on an old result must not blast sound
    var isRes = s.mode === "bee" && s.phase === "result", win = s.mode === "beewin";
    if (!isRes && !win) return;
    var ok = win || s.ok; b.classList.add(ok ? "res-ok" : "res-no");
    if (wasFirst) return;
    var lv = levelFor(s);
    if (ok) { confetti([0, 40, 90, 170, 300, 450, 750][lv]); cheer(lv); if (lv >= 4) b.classList.add("shake"); }
    else { buzzer(); b.classList.add("shake"); }
  }
  // Test keys on the projector: 1-5 celebration size, 6 champion, b buzzer.
  document.addEventListener("keydown", function (e) {
    if (e.key >= "1" && e.key <= "6") { confetti([0, 40, 90, 170, 300, 450, 750][+e.key]); cheer(+e.key); }
    if (e.key === "b") buzzer();
  });
  document.getElementById("fs").onclick = function () { (document.documentElement.requestFullscreen || function () {}).call(document.documentElement); };
})();
</script>
</body>
</html>
