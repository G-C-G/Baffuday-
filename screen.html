<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Projector</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
/* Projector. One screen, one moment. Yellow is the ground; blue carries the type. Dramatic moments invert it: blue ground, yellow type. */
html,body{height:100%}
body{padding:0;margin:0;overflow:hidden;cursor:none;transition:background .4s,color .4s;
  --hero:clamp(72px,13vw,230px);--major:clamp(44px,6.2vw,112px);--second:clamp(24px,2.7vw,48px);--lab:clamp(12px,1.15vw,20px);--micro:clamp(13px,1.35vw,24px)}
body.t-cream{background:var(--cream);color:var(--ink);--accent:var(--ink);--chipbg:var(--ink);--chipfg:var(--cream)}
body.t-ink,body.t-wine{background:var(--ink);color:var(--cream);--accent:var(--cream);--chipbg:var(--cream);--chipfg:var(--ink)}
body.t-black{background:#000;color:var(--cream);--accent:var(--cream);--chipbg:var(--cream);--chipfg:#000}
body.t-acid{background:var(--cream);color:var(--ink);--accent:var(--ink);--chipbg:var(--ink);--chipfg:var(--cream)}
/* A correct answer is a yellow screen in a blue frame that thickens in later rounds */
body.t-acid #stage{box-shadow:inset 0 0 0 calc(1vw + var(--lv,1)*.6vw) var(--ink)}
#stage{height:100%;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(2vh)}to{opacity:1;transform:none}}
.frame{height:100%;padding:5vh 7vw 4.5vh;display:grid;grid-template-rows:auto 1fr auto;gap:2vh}
.top,.foot{display:flex;justify-content:space-between;align-items:center;gap:2vw}
.lab{font:600 var(--lab)/1.3 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.lab.mute{color:inherit;opacity:.6}
.micro{font:400 var(--micro)/1.4 var(--sans);opacity:.85;color:inherit}
.main{display:flex;flex-direction:column;justify-content:center;gap:3vh;min-height:0}
.main.c{align-items:center;text-align:center}
.main.high{justify-content:flex-start;padding-top:5vh}
.main>.chip{align-self:flex-start}.main.c>.chip{align-self:center}
.hero{font:400 var(--hero)/.88 var(--serif);letter-spacing:-.025em;text-wrap:balance;margin:0}
.major{font:400 var(--major)/.96 var(--serif);letter-spacing:-.02em;text-wrap:balance;margin:0}
.second{font:400 var(--second)/1.25 var(--serif);margin:0}
.hero em,.major em,.second em{font-style:italic;color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:.6em;background:var(--chipbg);color:var(--chipfg);font:600 var(--lab)/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;padding:.55em .9em;border-radius:2px}
.chip.dot::before{content:"";width:.5em;height:.5em;border-radius:50%;background:var(--chipfg)}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:6vw}
.cols h3{margin:0 0 2vh;padding-bottom:1.4vh;border-bottom:1px solid currentColor;opacity:1}
.list{list-style:none;margin:0;padding:0;display:grid;gap:1.4vh}
.list li{font:400 var(--major)/1 var(--serif);letter-spacing:-.015em}
.list.sm li{font-size:var(--second);line-height:1.2}
.row3{display:grid;grid-template-columns:auto 1fr;gap:3vw;align-items:baseline;border-top:1px solid rgba(8,24,62,.3);padding-block:1.9vh}
.row3 .n{font:600 var(--lab) var(--sans);letter-spacing:.18em;color:var(--ink)}
.row3 .t{font:400 calc(var(--major)*.92)/1 var(--serif);letter-spacing:-.02em}
.opts{display:flex;gap:2.4vw;flex-wrap:wrap}
.optbar{position:fixed;left:0;right:0;bottom:17vh;display:flex;flex-direction:column;align-items:center;gap:1.6vh;pointer-events:none}
.optbar .opts{justify-content:center;gap:2.2vw}
.optbar .opts span{font:700 calc(var(--second)*.9) var(--sans);letter-spacing:.1em;border-width:2px;padding:.5em 1.15em}
.optnote{font:600 calc(var(--lab)*.9) var(--sans);letter-spacing:.22em;text-transform:uppercase;opacity:.75;min-height:1.4em}
.opts span{font:600 var(--lab) var(--sans);letter-spacing:.16em;text-transform:uppercase;border:1px solid currentColor;padding:.8em 1.4em;border-radius:2px}
.alts{display:flex;gap:3vw;flex-wrap:wrap;margin-top:1vh}
.alts p{margin:0;font:400 calc(var(--micro)*1.1)/1.35 var(--sans);opacity:.9;max-width:24vw}.alts b{font:400 calc(var(--micro)*1.7) var(--serif);display:block}
.letters{display:flex;gap:.12em;flex-wrap:wrap;justify-content:center;font:400 var(--hero)/1 var(--serif);text-transform:uppercase}
.letters i{font-style:normal;opacity:0;animation:l .01s forwards}
@keyframes l{to{opacity:1}}
.res{font:400 calc(var(--hero)*(1 + var(--lv,1)*.07))/.85 var(--serif);letter-spacing:-.03em;margin:0;animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.7);opacity:0}65%{transform:scale(1.06)}100%{transform:none;opacity:1}}
body.shake #stage{animation:shake .4s linear 3}
@keyframes shake{0%,100%{transform:none}25%{transform:translate(-1vw,.4vh)}50%{transform:translate(1vw,-.4vh)}75%{transform:translate(-.6vw,-.3vh)}}
.split{height:100%;display:grid;grid-template-rows:auto 1fr}
.splitTop{padding:4.5vh 7vw 3vh;display:grid;gap:1.6vh}
.teams{display:grid;grid-template-columns:1fr 1fr;min-height:0}
.team{padding:3vh 7vw 4vh 7vw;display:grid;align-content:start;gap:2vh}
.team.b{background:var(--ink);color:var(--cream)}
.team.a{background:var(--card)}
.team .lab{color:inherit;opacity:.75}
.team .names{list-style:none;margin:0;padding:0;display:grid;gap:1vh}.team .names li{font:400 var(--second)/1.1 var(--serif)}
.mark{width:clamp(48px,6vw,110px);height:auto}
mark{background:var(--chipbg);color:var(--chipfg);padding:0 .14em;border-radius:3px;font-style:normal}
/* Game-show answer states. Green and red exist ONLY for right and wrong; the rest of the screen stays yellow and blue. */
body{--right:#1F9D55;--wrong:#E01E37}
.opts span.sel{background:var(--ink);color:var(--cream);border-color:var(--ink)}
body.t-ink .opts span.sel{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.opts span.bad{background:var(--wrong);border-color:var(--wrong);color:#fff}
.opts span{transition:transform .3s,background .3s}
.final-q{font-style:italic;animation:pulse 1.1s ease-in-out infinite}
.final-q.slow{animation-duration:1.7s}
.opts span.throb{animation:throb .55s ease-in-out infinite}
@keyframes throb{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.fin-word{font:400 min(calc(var(--hero)*1.35),calc(176vw / var(--n,6)))/.95 var(--serif);letter-spacing:-.02em;margin:0;animation:pop .45s ease-out}
.said{font:400 min(calc(var(--hero)*.9),calc(120vw / var(--n,6)))/1 var(--serif);letter-spacing:-.02em;margin:0;opacity:.9;position:relative;display:inline-block}
.said::after{content:"";position:absolute;left:-2%;top:54%;height:.075em;width:0;background:#FF1F3D;animation:strike .16s .06s linear forwards}
@keyframes strike{to{width:104%}}
.wrongcol .fin-word{animation:drop .45s .5s both}
@keyframes drop{from{transform:translateY(-5vh);opacity:0}to{transform:none;opacity:1}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60}
#flash.go{animation:punch .22s ease-out}
@keyframes punch{0%{opacity:.95}100%{opacity:0}}
.wrongword{position:relative;display:inline-block;padding:.1em .3em}
.wrongrow{display:flex;align-items:center;justify-content:center;gap:5vw;text-align:left;width:100%}
.xbadge{flex:0 0 auto;height:min(48vh,30vw);aspect-ratio:1}
.xbadge svg{width:100%;height:100%;filter:drop-shadow(0 0 2.4vh rgba(255,31,61,.55));animation:stamp .4s cubic-bezier(.2,1.4,.4,1) both}
.wrongcol{display:grid;gap:1.4vh;min-width:0;justify-items:start}
.wrongcol .said{font-size:min(calc(var(--hero)*.8),calc(105vw / var(--n,6)))}
.wrongcol .fin-word{font-size:min(calc(var(--hero)*1.25),calc(105vw / var(--n,6)))}
.xstamp{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:40}
.xstamp svg{width:min(78vh,66vw);height:auto;filter:drop-shadow(0 0 3vh rgba(255,31,61,.55));animation:stamp .38s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{0%{transform:scale(3.6) rotate(-14deg);opacity:0}50%{opacity:1}100%{transform:scale(1) rotate(-7deg);opacity:1}}
body.flashred{animation:flashred .6s ease 2}
@keyframes flashred{0%,100%{background-color:var(--cream)}30%{background-color:var(--wrong)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.names li.mv-l2r{animation:l2r 1.15s cubic-bezier(.16,.9,.2,1) both}
.names li.mv-r2l{animation:r2l 1.15s cubic-bezier(.16,.9,.2,1) both}
@keyframes l2r{0%{transform:translateX(-48vw) scale(1.12);opacity:0}25%{opacity:1}100%{transform:none}}
@keyframes r2l{0%{transform:translateX(48vw) scale(1.12);opacity:0}25%{opacity:1}100%{transform:none}}
.was{display:block;font:500 var(--micro)/1.2 var(--sans);letter-spacing:.06em;opacity:.7;margin-top:.25em}
#slam{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink);z-index:70;animation:slamfade 1.9s linear both}
#slam span{font:400 calc(var(--hero)*1.45)/.9 var(--serif);letter-spacing:-.03em;color:var(--cream);animation:slamin .42s cubic-bezier(.2,1.5,.4,1) both;text-align:center}
@keyframes slamin{0%{transform:scale(3.4) rotate(-6deg);opacity:0}55%{opacity:1}100%{transform:scale(1) rotate(-2deg);opacity:1}}
@keyframes slamfade{0%,80%{opacity:1}100%{opacity:0}}
.beeimg{position:fixed;right:3.5vw;top:13vh;width:31vw;height:60vh;object-fit:contain;object-position:right top;border-radius:6px;filter:drop-shadow(0 1.4vh 2.6vh rgba(8,24,62,.4));animation:pop .5s ease-out;pointer-events:none}
/* the invitation title: Hinda's 2 [Pac-Man] Ate, with the bite out of the A and the crumbs (same as the guest form) */
.hero em.t28{font-size:.92em;white-space:nowrap}
.pac{display:inline-block;height:.66em;width:.66em;vertical-align:-.03em;margin:0 .06em 0 .1em;fill:var(--ink);font-style:normal}
.pac .eye{fill:var(--cream)}.pac .pupil{fill:var(--ink)}
.ate{position:relative;display:inline-block}
.ate .a{display:inline-block;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 74%,22% 66%,8% 58%,28% 51%,10% 43%,24% 35%,0 28%)}
.crumbs{position:absolute;left:-.3em;top:.1em;height:.7em;width:.35em;fill:var(--ink);animation:crumb 1.4s ease-in-out infinite alternate}
@keyframes crumb{from{transform:translate(0,0) rotate(0)}to{transform:translate(.06em,-.05em) rotate(8deg)}}
.pac .o{animation:chompO .5s steps(1,end) infinite}.pac .c{animation:chompC .5s steps(1,end) infinite}
@keyframes chompO{0%{opacity:1}50%{opacity:0}100%{opacity:1}}@keyframes chompC{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
/* icebreaker: "Find your group" on top, then the question, then the groups, then a real clock at the bottom */
.icemain{justify-content:flex-start!important;padding-top:0!important;gap:1.3vh!important;align-items:stretch!important}
.ice-h{text-align:center;font:400 calc(var(--major)*.5)/.95 var(--serif);letter-spacing:-.025em;margin:0}
.ice-q{text-align:center;font:400 calc(var(--major)*.82)/1.05 var(--serif);font-style:italic;margin:0;opacity:.95}
.nb{border:2px solid currentColor;border-radius:8px;padding:.9vh 1vw;font:500 calc(var(--micro)*1.05)/1.35 var(--sans)}
.groups{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:1.3vh 1vw;margin-top:.6vh}
.groups.g2{--cols:2}.groups.g3{--cols:3}.groups.g4{--cols:4}.groups.g5{--cols:5}.groups.g6{--cols:6}
.grp{border:2px solid currentColor;border-radius:8px;padding:1vh 1vw 1.1vh;background:rgba(255,255,255,.35);min-width:0}
.grp.hot{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.grp .gn{font:700 calc(var(--lab)*.95*var(--gs,1))/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;opacity:.75;margin:0 0 .8vh;display:flex;justify-content:space-between}
.grp .body{display:grid;grid-template-columns:1fr auto 1fr;gap:.6vw;align-items:center}
.grp .side small{display:block;font:700 calc(var(--lab)*.65*var(--gs,1))/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-bottom:.3vh}
.grp .side b{display:block;font:400 calc(var(--second)*.95*var(--gs,1))/1.08 var(--serif)}
.grp .side b i{display:block;font:500 calc(var(--lab)*.8*var(--gs,1))/1.2 var(--sans);font-style:normal;letter-spacing:.06em;opacity:.65}
.grp .vs{font:700 calc(var(--lab)*1.05)/1 var(--sans);letter-spacing:.1em;opacity:.8}
.groups.stack .grp .body{grid-template-columns:1fr;gap:.2vh}.groups.stack .grp .vs{display:none}
.groups.stack .grp .side + .side{border-top:1px solid currentColor;padding-top:.5vh;margin-top:.3vh}
.groups.stack .grp .side b{font-size:calc(var(--second)*.8*var(--gs,1))}.groups.stack .grp .gn{margin-bottom:.3vh}
.listen{font:600 calc(var(--micro)*1.25)/1.3 var(--sans);letter-spacing:.02em}
.lnote{font:400 var(--micro)/1.4 var(--sans);opacity:.85}
.iceclock{display:flex;align-items:center;gap:1.6vw}
.iceclock svg{height:10.5vh;width:10.5vh;flex:none}
.iceclock .dial{fill:none;stroke:currentColor;stroke-width:3;opacity:.35}
.iceclock .ring{fill:none;stroke:currentColor;stroke-width:6;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50px 50px;transition:stroke-dashoffset .25s linear}
.iceclock .tick{stroke:currentColor;stroke-width:2;opacity:.55}
.iceclock .hand{stroke:currentColor;stroke-width:3.2;stroke-linecap:round;transform-origin:50px 50px}
.iceclock .pin{fill:currentColor}
.iceclock .digits{font:400 9.5vh/.9 var(--serif);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.iceclock.low{color:#C41E3A}.iceclock.low .digits{animation:pulse .7s ease-in-out infinite}
.iceclock .cap{font:700 calc(var(--lab)*.9)/1.2 var(--sans);letter-spacing:.18em;text-transform:uppercase;opacity:.65;margin-top:.3vh}
.wheelbox{height:min(72vh,60vw);aspect-ratio:1/1}
.wheelbox svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 1.2vh 2vh rgba(0,0,0,.35))}
.fs{position:fixed;right:12px;bottom:10px;font:11px var(--sans);color:inherit;cursor:pointer;background:none;border:0;opacity:.55}
</style>
</head>
<body class="t-cream">
<div id="stage"></div>
<canvas id="fx"></canvas>
<div id="flash"></div>
<button class="fs" id="fs">click once to enable sound · fullscreen</button>
<script src="config.js"></script>
<script src="assets/store.js"></script>
<script>
(function () {
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
  var cfg = window.GCG_CONFIG || {}, title = cfg.TITLE || "", brand = title.toUpperCase();
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };
  var live = '<span class="chip dot">Live</span>';
  function bee(size) {
    return '<svg class="mark" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"' + (size ? ' style="width:' + size + '"' : "") + '>' +
      '<ellipse cx="32" cy="38" rx="10.5" ry="15"/><path d="M22 33h20M21.5 39h21M23 45h18"/><circle cx="32" cy="19" r="3.6"/>' +
      '<ellipse cx="19" cy="24" rx="10" ry="5" transform="rotate(-32 19 24)"/><ellipse cx="45" cy="24" rx="10" ry="5" transform="rotate(32 45 24)"/>' +
      '<path d="M30 16l-4-6M34 16l4-6"/></svg>';
  }
  function frame(top, main, foot, cls) {
    return '<div class="frame"><div class="top"><span class="lab mute">' + top + '</span>' + live + '</div><div class="main ' + (cls || "") + '">' + main + '</div><div class="foot">' + (foot || "") + '</div></div>';
  }
  // Highlight the homophones in the sentence so the audience can follow it (the set is the same words shown as options).
  function hl(text, marks, exact) {
    var raw = String(text == null ? "" : text); if (!marks || !marks.length) return esc(raw);
    var alts = marks.map(function (w) { var b = String(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), a = exact ? b : b + "(?:s|es|d|ed|ing|ly)?"; if (!exact && /e$/.test(w)) a += "|" + b.replace(/e$/, "") + "(?:ing|ed)"; return a; });
    var re = new RegExp("(^|[^A-Za-z])((?:" + alts.join("|") + "))(?![A-Za-z])", "gi"), out = "", last = 0, m;
    while ((m = re.exec(raw))) {
      var start = m.index + m[1].length;
      out += esc(raw.slice(last, start)) + "<mark>" + esc(m[2]) + "</mark>"; last = start + m[2].length; re.lastIndex = last;
    }
    return out + esc(raw.slice(last));
  }
  var micro = function (t) { return '<span class="micro">' + t + '</span>'; };
  var ul = function (a, c) { return '<ul class="list ' + (c || "") + '">' + (a || []).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>"; };

  // Hot take, after the question: everyone stands on the side they REALLY hold; then the twist swaps them, and each name keeps a "was ..." note.
  function standView(s, twisted, fresh) {
    var num = pad(s.num || 1), tot = s.total ? " / " + pad(s.total) : "", P = s.people || [];
    var inA = P.filter(function (p) { return twisted ? p.from === "b" : p.from === "a"; }), inB = P.filter(function (p) { return twisted ? p.from === "a" : p.from === "b"; });
    function items(arr, col) {
      return arr.map(function (p, i) {
        var cls = twisted && fresh ? (col === "A" ? "mv-r2l" : "mv-l2r") : "";
        var was = twisted ? '<span class="was">picked ' + esc(p.from === "a" ? s.a : s.b) + "</span>" : "";
        return '<li class="' + cls + '" style="animation-delay:' + (i * 130) + 'ms">' + esc(p.name) + was + "</li>";
      }).join("") || '<li style="opacity:.5">nobody</li>';
    }
    var head = twisted && s.winner ? '<span class="chip" style="font-size:calc(var(--lab)*1.6)">Most convincing &middot; ' + esc(s.winner) + "</span>" : twisted ? '<span class="chip">The twist &middot; defend your honour</span>' : '<span class="chip">What everyone picked</span>', cap = twisted ? "Now defending" : "Picked";
    return { theme: "cream", html: '<div class="split"><div class="splitTop"><div style="display:flex;justify-content:space-between;align-items:center"><span class="lab">Twisted hot take ' + num + tot + "</span>" + live + '</div><p class="second" style="max-width:48ch">' + esc(s.text) + "</p><div>" + head + "</div></div>" +
      '<div class="teams"><div class="team a"><span class="lab">' + cap + '</span><p class="major">' + esc(twisted ? s.b : s.a) + '</p><ul class="names">' + items(inA, "A") + "</ul></div>" +
      '<div class="team b"><span class="lab">' + cap + '</span><p class="major">' + esc(twisted ? s.a : s.b) + '</p><ul class="names">' + items(inB, "B") + "</ul></div></div></div>" };
  }
  // Icebreaker: the take, the clock (or "Find your group"), and the groups.
  function fmtClock(ms) { ms = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(ms / 60) + ":" + (ms % 60 < 10 ? "0" : "") + (ms % 60); }
  // A real clock: a dial with a sweeping hand and a ring that empties, plus the digits.
  function iceClockHtml(left, dur, timer) {
    var p = dur ? Math.max(0, Math.min(1, left / dur)) : 1, C = 2 * Math.PI * 44, low = timer && left <= 10000 && left > 0, ticks = "";
    for (var i = 0; i < 12; i++) { var a = i * 30 * Math.PI / 180; ticks += '<line class="tick" x1="' + (50 + Math.sin(a) * 38).toFixed(1) + '" y1="' + (50 - Math.cos(a) * 38).toFixed(1) + '" x2="' + (50 + Math.sin(a) * 43).toFixed(1) + '" y2="' + (50 - Math.cos(a) * 43).toFixed(1) + '"/>'; }
    var deg = (1 - p) * 360;
    return '<div class="iceclock' + (low ? " low" : "") + '" id="iceclock"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="dial" cx="50" cy="50" r="44"/><circle class="ring" id="icering" cx="50" cy="50" r="44" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - p)).toFixed(1) + '"/>' + ticks +
      '<line class="hand" id="icehand" x1="50" y1="50" x2="50" y2="14" style="transform:rotate(' + deg.toFixed(1) + 'deg)"/><circle class="pin" cx="50" cy="50" r="3.2"/></svg>' +
      '<div><div class="digits" id="icedigits">' + (timer && left <= 0 ? "Time." : fmtClock(left)) + '</div><div class="cap">' + (timer ? "left" : "on the clock") + "</div></div></div>";
  }
  function iceView(s) {
    var num = pad(s.num || 1) + " / " + pad(s.total || 8), G = s.groups || [], timer = s.phase === "timer";
