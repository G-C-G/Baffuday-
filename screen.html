<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Projector</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
/* Projector. One screen, one moment. Cream is the editorial ground; ink, wine and acid carry the drama. */
html,body{height:100%}
body{padding:0;margin:0;overflow:hidden;cursor:none;transition:background .4s,color .4s;
  --hero:clamp(72px,13vw,230px);--major:clamp(44px,6.2vw,112px);--second:clamp(24px,2.7vw,48px);--lab:clamp(12px,1.15vw,20px);--micro:clamp(13px,1.35vw,24px)}
body.t-cream{background:var(--cream);color:var(--ink);--accent:var(--wine)}
body.t-ink{background:var(--ink);color:var(--cream);--accent:var(--acid)}
body.t-wine{background:var(--wine);color:var(--cream);--accent:var(--acid)}
body.t-acid{background:var(--acid);color:var(--ink);--accent:var(--wine)}
#stage{height:100%;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(2vh)}to{opacity:1;transform:none}}
.frame{height:100%;padding:5vh 7vw 4.5vh;display:grid;grid-template-rows:auto 1fr auto;gap:2vh}
.top,.foot{display:flex;justify-content:space-between;align-items:center;gap:2vw}
.lab{font:600 var(--lab)/1.3 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.lab.mute{color:inherit;opacity:.6}
.micro{font:400 var(--micro)/1.4 var(--sans);opacity:.8}
.main{display:flex;flex-direction:column;justify-content:center;gap:3vh;min-height:0}
.main.c{align-items:center;text-align:center}
.main>.chip{align-self:flex-start}.main.c>.chip{align-self:center}
.hero{font:400 var(--hero)/.88 var(--serif);letter-spacing:-.025em;text-wrap:balance;margin:0}
.major{font:400 var(--major)/.96 var(--serif);letter-spacing:-.02em;text-wrap:balance;margin:0}
.second{font:400 var(--second)/1.25 var(--serif);margin:0}
.hero em,.major em,.second em{font-style:italic;color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:.6em;background:var(--acid);color:var(--ink);font:600 var(--lab)/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;padding:.55em .9em;border-radius:2px}
.chip.dot::before{content:"";width:.5em;height:.5em;border-radius:50%;background:var(--ink)}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:6vw}
.cols h3{margin:0 0 2vh;padding-bottom:1.4vh;border-bottom:1px solid currentColor;opacity:1}
.list{list-style:none;margin:0;padding:0;display:grid;gap:1.4vh}
.list li{font:400 var(--major)/1 var(--serif);letter-spacing:-.015em}
.list.sm li{font-size:var(--second);line-height:1.2}
.row3{display:grid;grid-template-columns:auto 1fr;gap:3vw;align-items:baseline;border-top:1px solid rgba(11,18,32,.2);padding-block:1.6vh}
.row3 .n{font:600 var(--lab) var(--sans);letter-spacing:.18em;color:var(--wine)}
.row3 .t{font:400 var(--major)/1 var(--serif);letter-spacing:-.02em}
.opts{display:flex;gap:2.4vw;flex-wrap:wrap}
.opts span{font:600 var(--lab) var(--sans);letter-spacing:.16em;text-transform:uppercase;border:1px solid currentColor;padding:.8em 1.4em;border-radius:2px}
.alts{display:flex;gap:3vw;flex-wrap:wrap;margin-top:1vh}
.alts p{margin:0;font:400 calc(var(--micro)*1.1)/1.35 var(--sans);opacity:.9;max-width:24vw}.alts b{font:400 calc(var(--micro)*1.7) var(--serif);display:block}
.letters{display:flex;gap:.12em;flex-wrap:wrap;justify-content:center;font:400 var(--hero)/1 var(--serif);text-transform:uppercase}
.letters i{font-style:normal;opacity:0;animation:l .01s forwards}
@keyframes l{to{opacity:1}}
.res{font:400 calc(var(--hero)*(1 + var(--lv,1)*.07))/.85 var(--serif);letter-spacing:-.03em;margin:0;animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.7);opacity:0}65%{transform:scale(1.06)}100%{transform:none;opacity:1}}
body.shake #stage{animation:shake .4s linear 3}
@keyframes shake{0%,100%{transform:none}25%{transform:translate(-1vw,.4vh)}50%{transform:translate(1vw,-.4vh)}75%{transform:translate(-.6vw,-.3vh)}}
.split{height:100%;display:grid;grid-template-rows:auto 1fr}
.splitTop{padding:4.5vh 7vw 3vh;display:grid;gap:1.6vh}
.teams{display:grid;grid-template-columns:1fr 1fr;min-height:0}
.team{padding:3vh 7vw 4vh 7vw;display:grid;align-content:start;gap:2vh}
.team.b{background:var(--wine);color:var(--cream)}
.team.a{background:var(--card)}
.team .lab{color:inherit;opacity:.75}
.team .names{list-style:none;margin:0;padding:0;display:grid;gap:1vh}.team .names li{font:400 var(--second)/1.1 var(--serif)}
.mark{width:clamp(48px,6vw,110px);height:auto}
.fs{position:fixed;right:12px;bottom:10px;font:11px var(--sans);color:var(--stone);cursor:pointer;background:none;border:0;opacity:.6}
</style>
</head>
<body class="t-cream">
<div id="stage"></div>
<button class="fs" id="fs">click once to enable sound · fullscreen</button>
<script src="config.js"></script>
<script src="assets/store.js"></script>
<script>
(function () {
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
  var cfg = window.GCG_CONFIG || {}, title = cfg.TITLE || "", brand = title.toUpperCase();
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };
  var live = '<span class="chip dot">Live</span>';
  function bee(size) {
    return '<svg class="mark" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"' + (size ? ' style="width:' + size + '"' : "") + '>' +
      '<ellipse cx="32" cy="38" rx="10.5" ry="15"/><path d="M22 33h20M21.5 39h21M23 45h18"/><circle cx="32" cy="19" r="3.6"/>' +
      '<ellipse cx="19" cy="24" rx="10" ry="5" transform="rotate(-32 19 24)"/><ellipse cx="45" cy="24" rx="10" ry="5" transform="rotate(32 45 24)"/>' +
      '<path d="M30 16l-4-6M34 16l4-6"/></svg>';
  }
  function frame(top, main, foot, cls) {
    return '<div class="frame"><div class="top"><span class="lab mute">' + top + '</span>' + live + '</div><div class="main ' + (cls || "") + '">' + main + '</div><div class="foot">' + (foot || "") + '</div></div>';
  }
  var micro = function (t) { return '<span class="micro">' + t + '</span>'; };
  var ul = function (a, c) { return '<ul class="list ' + (c || "") + '">' + (a || []).map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>"; };

  // Each view returns { theme, html }.
  function view(s) {
    var m = s.mode;
    if (m === "tonight") {
      var items = cfg.LINEUP || ["The Evil Spelling Bee", "Karaoke Roulette", "Hot Takes", "???", "Cake"];
      return { theme: "cream", html: frame(esc(brand), '<span class="lab">Tonight</span><div>' + items.map(function (t, i) { return '<div class="row3"><span class="n">' + pad(i + 1) + '</span><span class="t">' + esc(t) + "</span></div>"; }).join("") + "</div>", micro("Subject to chaos.")) };
    }
    if (m === "menu") {
      return { theme: "cream", html: frame(esc(brand), '<span class="lab">The menu</span><div class="cols"><div><h3 class="lab">To eat</h3>' + ul(["Vege noodles", "Beef goulash", "Potato salad", "Chicken wings"]) + '</div><div><h3 class="lab">To drink</h3>' + ul(["Sobolo", "Ginger and pineapple", "Water"]) + "</div></div>",
        '<span class="second" style="font-family:var(--sans);font-size:var(--micro)"><span class="lab" style="margin-right:1.2em">Allergies</span>Tell Hinda or the host before you eat. Every dish can be checked. Please do.</span>') };
    }
    if (m === "karaoke") {
      return { theme: "ink", html: frame("Karaoke", '<span class="lab">Unfortunately</span><p class="hero">You\'re<br>up.</p><p class="major" style="color:var(--acid);font-style:italic">' + esc(s.name) + '</p><p class="second" style="opacity:.85">' + esc(s.song) + "</p>", micro("There is no appeal process."), "") };
    }
    if (m === "hottake") {
      var num = pad(s.num || 1), tot = s.total ? " / " + pad(s.total) : "";
      if (!s.reveal) return { theme: "cream", html: frame("Hot take " + num + tot, '<p class="major" style="font-size:calc(var(--major)*1.15);max-width:20ch">' + esc(s.text) + "</p>", micro("Pick a side. Quietly.")) };
      return { theme: "cream", html: '<div class="split"><div class="splitTop"><div style="display:flex;justify-content:space-between;align-items:center"><span class="lab">Hot take ' + num + tot + "</span>" + live + '</div><p class="second" style="max-width:48ch">' + esc(s.text) + '</p><div><span class="chip" style="font-size:calc(var(--lab)*1.4)">Defend the opposite.</span></div></div>' +
        '<div class="teams"><div class="team a"><span class="lab">Team A</span><p class="major">For</p><ul class="names">' + (s.argueFor || []).map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("") + '</ul></div>' +
        '<div class="team b"><span class="lab">Team B</span><p class="major">Against</p><ul class="names">' + (s.argueAgainst || []).map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("") + "</ul></div></div></div>" };
    }
    if (m === "beerules") {
      return { theme: "cream", html: frame("The rules", bee("clamp(48px,5vw,90px)") + '<p class="major">The Evil<br><em>Spelling Bee.</em></p><div class="cols" style="grid-template-columns:1fr 1fr"><div><h3 class="lab">You may ask for</h3>' + ul(["Definition", "Sentence", "Part of speech"], "sm") + '</div><div><h3 class="lab" style="color:var(--wine)">You may not ask for</h3><ul class="list sm" style="color:var(--wine)"><li>The first letter</li><li>The number of letters</li><li>Another sentence</li><li>The word in a different context</li></ul></div></div>', micro("Asking anyway is a personal choice.")) };
    }
    if (m === "beestage") {
      return { theme: "cream", html: frame("The Evil Spelling Bee", '<p class="hero" style="font-size:calc(var(--hero)*1.7);line-height:.8">' + esc(s.standing) + '</p><span class="lab">Still standing</span>' + (s.next ? '<p class="second">Up next: <em>' + esc(s.next) + "</em></p>" : ""), micro("It gets worse.")) };
    }
    if (m === "beecall") {
      return { theme: "ink", html: frame("Round " + pad(s.round || 1), '<span class="chip">You are next</span><p class="hero">' + esc(s.name) + '</p><p class="second" style="font-style:italic;opacity:.85">Unfortunately. To the stage, please.</p>', micro(esc(s.standing) + " still standing")) };
    }
    if (m === "beewin") {
      return { theme: "ink", html: frame("The Evil Spelling Bee", '<p class="hero" style="color:var(--acid);font-size:calc(var(--hero)*1.25)">Champion.</p><p class="major">' + esc(s.name) + "</p>", micro("Absurdly important.")) };
    }
    if (m === "bee") {
      var rd = "Round " + pad(s.round || 1);
      var foot = micro(esc(s.contestant) + " &middot; " + esc(s.standing) + " still standing &middot; " + esc(s.n) + " / " + esc(s.total));
      if (s.phase !== "result") {
        var big = (s.sentence || "").length > 80 ? "calc(var(--major)*.82)" : "var(--major)";
        return { theme: "cream", html: frame(rd + " &middot; " + esc(s.contestant), '<p class="major" style="font-size:' + big + ';max-width:22ch">&ldquo;' + esc(s.sentence) + '&rdquo;</p>' +
          (s.meaning ? '<div><span class="lab">Meaning</span><p class="second" style="font-style:italic;color:var(--wine)">' + esc(s.meaning) + "</p></div>" : "") +
          '<div class="opts">' + (s.options || []).map(function (o) { return "<span>" + esc(o) + "</span>"; }).join("") + "</div>", '<span class="lab">Spell it.</span>' + foot) };
      }
      var ok = !!s.ok, alts = (s.alts || []).map(function (a) { return "<p><b>" + esc(a.w) + "</b>" + esc(a.m) + "</p>"; }).join("");
      return { theme: ok ? "acid" : "wine", html: frame(rd, '<p class="res" style="--lv:' + (s.level || 1) + ';' + (ok ? "" : "color:var(--acid)") + '">' + (ok ? "Correct." : "Wrong.") + '</p><div><span class="lab" style="color:inherit;opacity:.7">The correct answer was</span><p class="major">' + esc(s.answer) + '</p></div><div class="alts">' + alts + "</div>",
        micro(ok ? "We'll allow it." : "Yes, those words are deliberately annoying.") + micro(esc(s.contestant) + " &middot; " + esc(s.standing) + " still standing")) };
    }
    // home
    var parts = title.match(/^(\S+)\s*(.*)$/) || [title, title, ""];
    return { theme: "cream", html: frame("The game night", '<p class="hero" style="font-size:calc(var(--hero)*1.2)">' + esc(parts[1]) + (parts[2] ? "<br><em>" + esc(parts[2]) + "</em>" : "") + "</p>", micro("Some of it is voluntary.")) };
  }
  function spellView(s) {
    var L = String(s.said).toUpperCase().split("");
    return { theme: "ink", html: frame("Round " + pad(s.round || 1) + " &middot; " + esc(s.contestant), '<span class="lab">They spelled</span><div class="letters">' + L.map(function (c, i) { return '<i style="animation-delay:' + (i * 0.13) + 's">' + (c === " " ? "&nbsp;" : esc(c)) + "</i>"; }).join("") + "</div>", micro("Take your time. Actually, don't."), "c") };
  }

  var stage = document.getElementById("stage"), last = "", timer = 0, firstLoad = true;
  function draw(v) {
    document.body.className = "t-" + v.theme; stage.style.animation = "none"; void stage.offsetWidth; stage.style.animation = ""; stage.innerHTML = v.html;
  }
  store.subscribe("state", function (s) {
    s = s || { mode: "home" };
    var k = JSON.stringify(s); if (k === last) return; last = k; clearTimeout(timer);
    var fresh = !firstLoad; firstLoad = false;
    if (s.mode === "bee") s.level = levelFor(s);
    if (fresh && s.mode === "bee" && s.phase === "result" && s.said) {
      draw(spellView(s));
      timer = setTimeout(function () { draw(view(s)); react(s, true); }, Math.min(String(s.said).length * 130 + 1100, 4000));
    } else { draw(view(s)); react(s, fresh); }
  });

  // ---- Sound and shake: wrong buzzes and shakes, right cheers. The cheer grows with the round and with how few are left. ----
  var ac = null;
  function audio() { try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch (e) { ac = null; } return ac; }
  document.addEventListener("click", function () { audio(); document.getElementById("fs").textContent = "fullscreen"; });
  function tone(f, t0, dur, type, vol) {
    var a = audio(); if (!a) return; var o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, a.currentTime + t0); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + t0 + dur);
    o.connect(g); g.connect(a.destination); o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + dur + .05);
  }
  function noise(dur, vol) {
    var a = audio(); if (!a) return; var n = a.sampleRate * dur, b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 2500; g.gain.value = vol;
    s.buffer = b; s.connect(f); f.connect(g); g.connect(a.destination); s.start();
  }
  function buzzer() { tone(110, 0, .45, "sawtooth", .8); tone(117, 0, .45, "square", .5); tone(98, .5, .7, "sawtooth", .8); tone(104, .5, .7, "square", .5); noise(.3, .5); }
  function cheer(level) {
    var notes = [523, 659, 784, 1047, 1319, 1568, 2093], count = 3 + level * 2, step = Math.max(.07, .16 - level * .015);
    for (var i = 0; i < count; i++) tone(notes[i % notes.length] * (i >= 7 ? 2 : 1), i * step, .3, "triangle", .18 + level * .04);
    noise(.4 + level * .35, .08 + level * .05);
    if (level >= 4) { tone(262, count * step, 1.2, "sawtooth", .25); tone(392, count * step, 1.2, "sawtooth", .2); tone(523, count * step, 1.2, "sawtooth", .2); }
  }
  function levelFor(s) { return s.mode === "beewin" ? 6 : Math.min(5, (s.round || 1) + ((s.standing || 9) <= 3 ? 1 : 0)); }
  function react(s, fresh) {
    document.body.classList.remove("shake");
    if (!fresh) return;
    if (s.mode === "bee" && s.phase === "result") { if (s.ok) cheer(s.level || 1); else { buzzer(); document.body.classList.add("shake"); } }
    if (s.mode === "beewin") { cheer(6); document.body.classList.add("shake"); }
  }
  // Test keys: 1-5 cheer sizes, 6 champion, b buzzer
  document.addEventListener("keydown", function (e) { if (e.key >= "1" && e.key <= "6") cheer(+e.key); if (e.key === "b") buzzer(); });
  document.getElementById("fs").onclick = function () { (document.documentElement.requestFullscreen || function () {}).call(document.documentElement); };
})();
</script>
</body>
</html>
